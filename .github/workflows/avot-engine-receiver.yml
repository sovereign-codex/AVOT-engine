name: AVOT Engine Receiver

on:
  repository_dispatch:
    types:
      - avot_execution

permissions:
  contents: write

jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare and validate receiver policy
        id: prepare
        run: node scripts/receiver/run.mjs prepare

      - name: Create read-only upstream claim token
        if: steps.prepare.outputs.ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          owner: sovereign-codex
          repositories: Codex-control-center
          permission-contents: read

      - name: Revalidate upstream claims and record receipt once
        if: steps.prepare.outputs.ready == 'true'
        env:
          CCC_CLAIM_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/receiver/run.mjs execute

      - name: Preserve receiver observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avot-receiver-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .receiver-state/actions-event.json
            .receiver-state/prepared.json
            .receiver-state/result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
